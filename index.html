  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:       #f7f3ed;
      --warm-white:  #fdfaf6;
      --charcoal:    #2a2420;
      --mid:         #5c4f45;
      --accent:      #7a5c3e;
      --accent-light:#c4a882;
      --rule:        #ddd4c6;
    }

    body {
      font-family: 'Source Sans 3', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--warm-white);
      border-bottom: 1px solid var(--rule);
      padding: 1.25rem 2rem 1rem;
      text-align: center;
    }

    .eyebrow {
      font-family: 'Source Sans 3', sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 600;
      line-height: 1.25;
      color: var(--charcoal);
      max-width: 680px;
      margin: 0 auto 1rem;
    }

    .rule-ornament {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      justify-content: center;
      margin: 1.25rem auto 0;
      max-width: 300px;
    }
    .rule-ornament span { flex: 1; height: 1px; background: var(--accent-light); }
    .rule-ornament em {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1rem;
      color: var(--accent-light);
    }

    /* ── Main layout ── */
    main {
      flex: 1;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 2rem 2rem;
    }

    /* ── Intro card ── */
    .intro {
      display: flex;
      gap: 2rem;
      align-items: center;
      background: var(--warm-white);
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 2rem;
      margin-bottom: 1.25rem;
    }

    .avatar-wrap {
      flex-shrink: 0;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--accent-light);
    }
    .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }

    .intro-text h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--charcoal);
    }
    .intro-text p {
      font-size: 0.95rem;
      font-weight: 300;
      line-height: 1.7;
      color: var(--mid);
    }

    /* ── Chat container ── */
    .chat-container {
      background: var(--warm-white);
      border: 1px solid var(--rule);
      border-radius: 6px;
      overflow: hidden;
      height: calc(100vh - 310px);
      min-height: 420px;
      position: relative;
    }
    flowise-fullchatbot { display: block; width: 100%; height: 100%; }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 1.5rem 2rem;
      border-top: 1px solid var(--rule);
      font-size: 0.78rem;
      color: var(--accent-light);
      letter-spacing: 0.04em;
      background: var(--warm-white);
    }

    flowise-chatbot { display: none; }

    @media (max-width: 560px) {
      main { padding: 0.75rem 1rem 1rem; }
      .intro { padding: 1rem; gap: 1rem; margin-bottom: 0.75rem; }
      .avatar-wrap { width: 72px; height: 72px; flex-shrink: 0; }
      .intro-text h2 { font-size: 1rem; margin-bottom: 0.3rem; }
      .intro-text p { font-size: 0.85rem; line-height: 1.5; }
      .chat-container { height: calc(100vh - 260px); min-height: 360px; }
    }
  </style>
</head>

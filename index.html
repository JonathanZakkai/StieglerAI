<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>An AI Companion to Stiegler's Technics &amp; Time</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:       #f7f3ed;
      --warm-white:  #fdfaf6;
      --charcoal:    #2a2420;
      --mid:         #5c4f45;
      --accent:      #7a5c3e;
      --accent-light:#c4a882;
      --rule:        #ddd4c6;
    }

    body {
      font-family: 'Source Sans 3', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--warm-white);
      border-bottom: 1px solid var(--rule);
      padding: 1.25rem 2rem 1rem;
      text-align: center;
    }

    .eyebrow {
      font-family: 'Source Sans 3', sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 600;
      line-height: 1.25;
      color: var(--charcoal);
      max-width: 680px;
      margin: 0 auto 1rem;
    }

    .rule-ornament {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      justify-content: center;
      margin: 1.25rem auto 0;
      max-width: 300px;
    }
    .rule-ornament span { flex: 1; height: 1px; background: var(--accent-light); }
    .rule-ornament em {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1rem;
      color: var(--accent-light);
    }

    /* ── Main layout ── */
    main {
      flex: 1;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 2rem 2rem;
    }

    /* ── Intro card ── */
    .intro {
      display: flex;
      gap: 2rem;
      align-items: center;
      background: var(--warm-white);
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 2rem;
      margin-bottom: 1.25rem;
    }

    .avatar-wrap {
      flex-shrink: 0;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--accent-light);
    }
    .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }

    .intro-text h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--charcoal);
    }
    .intro-text p {
      font-size: 0.95rem;
      font-weight: 300;
      line-height: 1.7;
      color: var(--mid);
    }

    /* ── Chat container ── */
    .chat-container {
      background: var(--warm-white);
      border: 1px solid var(--rule);
      border-radius: 6px;
      overflow: hidden;
      min-height: 520px;
      position: relative;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 1.5rem 2rem;
      border-top: 1px solid var(--rule);
      font-size: 0.78rem;
      color: var(--accent-light);
      letter-spacing: 0.04em;
      background: var(--warm-white);
    }

    @media (max-width: 560px) {
      .intro { flex-direction: column; align-items: center; text-align: center; }
      .avatar-wrap { width: 108px; height: 108px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>An AI Companion to Stiegler's<br><em>Technics &amp; Time</em></h1>
    <div class="rule-ornament">
      <span></span><em>&#10022;</em><span></span>
    </div>
  </header>

  <main>
    <div class="intro">
      <div class="avatar-wrap">
<img src="StieglerHead01.jpg" alt="Bernard Stiegler" />
      </div>
      <div class="intro-text">
        <h2>About this companion</h2>
        <p>
          Explore Bernard Stiegler's three-volume <em>Technics and Time</em> and
          dialog about his philosophy of technology, memory, and human experience.
        </p>
      </div>
    </div>

    <div class="chat-container" id="chat-mount"></div>
  </main>

  <footer>
    Built with Flowise &middot; Ollama &middot; ComfyUI &nbsp;&bull;&nbsp; Local AI stack on Apple Silicon
  </footer>

  <script type="module">
    import Chatbot from "https://cdn.jsdelivr.net/npm/flowise-embed/dist/web.js";
    Chatbot.init({
      chatflowid: "05a8f327-ff3b-45f2-92f7-2f5a4f2c3b9f",
      apiHost: "http://localhost:3001",
      theme: {
        button: { backgroundColor: "#7a5c3e" },
        chatWindow: {
          welcomeMessage: "Hello — I'm here to help you explore Bernard Stiegler's Technics and Time. What would you like to discuss?",
          backgroundColor: "#fdfaf6",
          fontSize: 15,
          showTitle: false,
          showAvatar: true,
          avatarSrc: "StieglerHead01.jpg",
        },
        userMessage: {
          backgroundColor: "#7a5c3e",
          textColor: "#ffffff",
        },
        botMessage: {
          backgroundColor: "#f0ebe3",
          textColor: "#2a2420",
        },
        textInput: {
          placeholder: "Ask about Technics and Time…",
          backgroundColor: "#ffffff",
          textColor: "#2a2420",
          sendButtonColor: "#7a5c3e",
        }
      }
    });
  </script>

</body>
</html>
